[project]
name = "fintech-agent"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cryptography==50.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

